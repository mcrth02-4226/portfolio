<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work | Otamo Tipa</title>
<meta name="description" content="Video and photography by Otamo Tipa: showreel, short form and photography.">
<link rel="icon" type="image/jpeg" href="images/alasalimatcutplace_3.1.1.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <a href="index.html">Otamo Tipa</a>
  <nav aria-label="Work sections">
    <a href="#video">Video</a>
    <a href="work/photo.html">Photo</a>
  </nav>
</header>

<main>

  <!-- SHOWREEL (full screen) -->
  <div class="hero" id="video">
    <!-- STEP 1: Replace the placeholder with your Vimeo or YouTube embed.
         YouTube: <div class="embed r16"><iframe src="https://www.youtube.com/embed/VIDEO_ID" title="Otamo Tipa showreel" allowfullscreen></iframe></div>
         Vimeo:   <div class="embed r16"><iframe src="https://player.vimeo.com/video/VIDEO_ID" title="Otamo Tipa showreel" allowfullscreen></iframe></div> -->
    <div class="ph r16">Showreel embed</div>
    <div class="cap">Showreel</div>
  </div>

  <!-- SHORT FORM -->
  <div class="label" id="short">Short form</div>
  <!-- STEP 2: Put compressed MP4s (under about 10 MB) in a "clips" folder, then replace each placeholder with:
       <div class="embed r9"><video src="clips/clip1.mp4" poster="clips/clip1.jpg" controls muted playsinline preload="none"></video></div>
       For a looping clip with no controls use: autoplay muted loop playsinline -->
  <div class="row">
    <div class="ph r9">Clip 1</div>
    <div class="ph r9">Clip 2</div>
    <div class="ph r9">Clip 3</div>
    <div class="ph r9">Clip 4</div>
    <div class="ph r9">Clip 5</div>
  </div>

  <!-- PHOTOGRAPHY: one big image that links to the photo page -->
  <div class="label">Photography</div>
  <!-- Put your cover photo in "images" and replace the placeholder with:
       <img src="images/photo-cover.jpg" alt="Photography by Otamo Tipa"> -->
  <a class="full" href="work/photo.html" aria-label="See the photography">
    <div class="ph">Photography cover image</div>
    <div class="cap">Photography</div>
    <span class="go">View</span>
  </a>

  <!-- SPEC ADS (hidden until you have some). To show them, remove the comment markers that open on this line and close on the last line of this block, keeping the content between.
  <div class="label" id="ads">Spec ads</div>
  <div class="stack">
    <div><div class="ph r16">Spec ad 1 embed</div><div class="cap">Spec ad title</div></div>
    <div><div class="ph r16">Spec ad 2 embed</div><div class="cap">Spec ad title</div></div>
  </div>
  -->
</main>

<footer>
  <div>
    <a href="mailto:otamitto.media@gmail.com">otamitto.media@gmail.com</a>
    <a href="https://instagram.com/otamitto" target="_blank" rel="noopener">Instagram</a>
  </div>
  <a href="index.html">Home</a>
</footer>

</body>
</html>
