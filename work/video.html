<main id="top">

  <!-- SHOWREEL (full screen, starts at the very top of the page) -->
  <div class="hero" id="showreel">
    <!-- Replace the placeholder with your Vimeo or YouTube embed.
         YouTube: <div class="embed r16"><iframe src="https://www.youtube.com/embed/VIDEO_ID" title="Otamo Tipa showreel" allowfullscreen></iframe></div>
         Vimeo:   <div class="embed r16"><iframe src="https://player.vimeo.com/video/VIDEO_ID" title="Otamo Tipa showreel" allowfullscreen></iframe></div> -->
    <div class="ph r16">Showreel embed</div>
    <div class="cap">Showreel</div>
  </div>

  <!-- SHORT FORM -->
  <div class="label" id="short">Short form</div>
  <!-- Each box waits for a thumbnail image named short-form-1-thumbnail
       (images folder, .jpg/.jpeg/.png/.webp, horizontal 4:3). Visitors see the thumbnail; when they click it,
       the video (clips folder, named short-form-1.mp4) loads and plays. Same for 2, 3 and 4.
       Keep each MP4 under about 10 MB. -->
  <div class="clips43">
    <div class="ph r43" data-clip="short-form-1" data-ratio="r43">short-form-1-thumbnail</div>
    <div class="ph r43" data-clip="short-form-2" data-ratio="r43">short-form-2-thumbnail</div>
    <div class="ph r43" data-clip="short-form-3" data-ratio="r43">short-form-3-thumbnail</div>
    <div class="ph r43" data-clip="short-form-4" data-ratio="r43">short-form-4-thumbnail</div>
  </div>

  <!-- SPEC ADS (hidden until you have some). To show them, remove the comment markers that open on this line and close on the last line of this block, keeping the content between.
  <div class="label" id="ads">Spec ads</div>
  <div class="stack">
    <div><div class="ph r16">Spec ad 1 embed</div><div class="cap">Spec ad title</div></div>
    <div><div class="ph r16">Spec ad 2 embed</div><div class="cap">Spec ad title</div></div>

  -->
