<!DOCTYPE html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otamo Tipa</title>
<meta name="description" content="Contact Otamo Tipa, videographer and photographer.">
<link rel="icon" type="image/jpeg" href="images/alasalimatcutplace_3.1.1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
<style>
body{background:#000;font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:6rem var(--pad) 4rem}
.credits{width:100%;max-width:60rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.6rem}

.eyebrow{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* The email is the page. On hover a line draws underneath it. */
.mail{font-size:clamp(1.5rem,6.2vw,4.4rem);font-weight:300;letter-spacing:-.02em;line-height:1.15;color:#fff;
  overflow-wrap:anywhere;padding-bottom:.18em;
  background:linear-gradient(#fff,#fff) 0 100%/0 1px no-repeat;transition:background-size .5s ease}
.mail:hover,.mail:focus-visible{background-size:100% 1px;color:#fff}
@media(hover:none){.mail{background-size:100% 1px}}

.copy{font:inherit;font-size:.8rem;color:#ddd;background:none;border:1px solid #444;border-radius:999px;
  padding:.55rem 1.2rem;cursor:pointer;transition:border-color .2s ease,color .2s ease}
.copy:hover,.copy:focus-visible{border-color:#fff;color:#fff}

.note{font-size:.82rem;color:var(--muted);max-width:34ch}
.ig{font-size:.75rem;color:#6d6d72}
.ig:hover{color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.credits>*{animation:rise .8s ease both}
.credits>:nth-child(2){animation-delay:.12s}
.credits>:nth-child(3){animation-delay:.24s}
.credits>:nth-child(4){animation-delay:.36s}
.credits>:nth-child(5){animation-delay:.48s}
@media(prefers-reduced-motion:reduce){.credits>*{animation:none}.mail{transition:none}}
</style>
<script src="site.js?v=5" defer></script>
<script src="analytics.js?v=5" defer></script>
</head>
<body>

<header>
  <a href="index.html">Otamo Tipa</a>
  <nav aria-label="Main">
    <a href="work.html">Work</a>
  </nav>
</header>

<main>
  <div class="credits">
    <p class="eyebrow">Contact</p>

    <!-- Opens the visitor's email app with a subject and a short outline already filled in -->
    <a class="mail" href="mailto:otamitto.media@gmail.com?subject=Booking%20enquiry&amp;body=Hi%20Otamo%2C%0A%0AI%27d%20like%20to%20talk%20about%20a%20project.%0A%0ADate%3A%0ALocation%3A%0AWhat%20I%20need%3A%0ABudget%20(optional)%3A%0A%0AThanks%2C%0A">otamitto.media@gmail.com</a>

    <button type="button" class="copy" id="copy">Copy email</button>

    <p class="note">Tell me about your project: what it is, when it happens and where.</p>

    <a class="ig" href="https://instagram.com/otamitto" target="_blank" rel="noopener">Instagram</a>
  </div>
</main>

<p class="sr" id="status" role="status" aria-live="polite"></p>

<script>
(function () {
  var email = 'otamitto.media@gmail.com';
  var btn = document.getElementById('copy');
  var status = document.getElementById('status');
  var timer;

  function done() {
    btn.textContent = 'Copied';
    status.textContent = 'Email address copied';
    if (window.track) window.track('email_copy');
    clearTimeout(timer);
    timer = setTimeout(function () { btn.textContent = 'Copy email'; status.textContent = ''; }, 2000);
  }
  function fallback() {                       // for browsers without the clipboard API
    var t = document.createElement('textarea');
    t.value = email;
    t.setAttribute('readonly', '');
    t.style.position = 'absolute';
    t.style.left = '-9999px';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); done(); } catch (e) { btn.textContent = email; }
    document.body.removeChild(t);
  }
  btn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(email).then(done, fallback);
    } else {
      fallback();
    }
  });
})();
</script>

</body>
</html>
